name: Estúdio de Vídeos
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: write
  issues: write
concurrency: estudio
jobs:
  video:
    if: startsWith(github.event.issue.title, '🎬') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      PIXABAY_VIDEOS: "1"
      GH_TOKEN: ${{ github.token }}
      N: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - name: Avisar que começou
        run: gh issue comment $N -b "⏳ Fazendo o vídeo... leva uns 5 a 10 minutos."
      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu > /dev/null
          pip install -q edge-tts numpy
      - name: Conferir chaves
        id: chk
        run: |
          F=""
          [ -z "$GEMINI_API_KEY" ] && F="$F GEMINI_API_KEY"
          [ -z "$ELEVENLABS_API_KEY$ELEVENLABS_API_KEYS" ] && echo "Sem ElevenLabs: usando voz gratuita"
          if [ -n "$F" ]; then
            gh issue comment $N -b "🔑 Falta cadastrar a chave:$F. Abra Settings > Secrets and variables > Actions > New repository secret, cole a chave e depois toque em Reabrir (Reopen) neste pedido."
            exit 1
          fi
      - name: Ler pedido
        working-directory: estudio
        env:
          BODY: ${{ github.event.issue.body }}
          TITLE: ${{ github.event.issue.title }}
        run: python3 ler_pedido.py
      - name: Diretor (Gemini)
        working-directory: estudio
        run: python3 -c "import json,subprocess,sys;a=json.load(open('args.json'));sys.exit(subprocess.call(['python3','diretor.py',*a,'-o','plano.json']))"
      - name: Renderizar
        working-directory: estudio
        run: python3 estudio.py plano.json saida
      - name: Publicar
        working-directory: estudio/saida
        run: |
          F=$(ls *.mp4 | head -1); mv "$F" video-$N.mp4
          gh release delete video-$N -y --cleanup-tag 2>/dev/null || true
          gh release create video-$N video-$N.mp4 publicacao.txt --title "$(head -1 publicacao.txt | sed 's/^TÍTULO: //')" --notes-file publicacao.txt
      - name: Guardar no sistema
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          cd estudio/saida
          ffmpeg -v error -y -i video-$N.mp4 -c:v libx264 -preset medium -crf 25 -maxrate 3M -bufsize 6M -c:a aac -b:a 128k -movflags +faststart site.mp4
          ffmpeg -v error -y -ss 1.5 -i video-$N.mp4 -frames:v 1 -vf scale=540:-2 -q:v 4 capa.jpg
          export DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 site.mp4)
          cd "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q --depth=1 origin gh-pages
          git worktree add -q /tmp/gp FETCH_HEAD
          mkdir -p /tmp/gp/estudio/videos
          cp estudio/saida/site.mp4 /tmp/gp/estudio/videos/video-$N.mp4
          cp estudio/saida/capa.jpg /tmp/gp/estudio/videos/video-$N.jpg
          python3 estudio/indexar.py /tmp/gp/estudio/videos.json $N estudio/saida/publicacao.txt "$TITLE"
          cd /tmp/gp && git add -A && git commit -qm "Vídeo $N no sistema" && git push -q origin HEAD:gh-pages
      - name: Avisar pronto
        working-directory: estudio/saida
        run: |
          { echo "✅ Vídeo pronto e guardado no sistema: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/estudio/"; echo; echo '```'; cat publicacao.txt; echo '```'; } > c.md
          gh issue comment $N -F c.md
          gh issue close $N
      - name: Avisar erro
        if: failure() && steps.chk.outcome != 'failure'
        run: gh issue comment $N -b "❌ Deu erro. Veja o log em https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
